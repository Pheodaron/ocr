    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: lighton
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  lighton:
    <<: [*worker, *vlm-image]
    profiles: [lighton]
    environment:
      <<: *environment
      OCR_WORKER_BACKEND: lighton
    depends_on:
      models-lighton:
        condition: service_completed_successfully

  models-kdl:
    <<: *model-preparation
    profiles: [kdl]
    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: kdl
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  kdl:
    <<: [*worker, *kdl-image]
    profiles: [kdl]
    environment:
      <<: *environment
      OCR_WORKER_BACKEND: kdl
    depends_on:
      models-kdl:
        condition: service_completed_successfully

  models-lighton-small:
    <<: *model-preparation
    profiles: [lighton_small]
    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: lighton_small
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  lighton-small:
    <<: [*worker, *vlm-image]
    profiles: [lighton_small]
    environment:
      <<: *environment
      OCR_WORKER_BACKEND: lighton_small
    depends_on:
