  models-falcon:
    <<: *model-preparation
    profiles: [falcon]
    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: falcon
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  falcon:
    <<: [*worker, *falcon-image]
    profiles: [falcon]
    environment:
