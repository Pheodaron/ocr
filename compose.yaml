name: document-ocr

x-api-image: &api-image
  image: localhost/document-ocr-api:0.1.0
  build: {context: ., dockerfile: Containerfile, target: api}
x-vlm-image: &vlm-image
  image: localhost/document-ocr-vlm:0.1.0
  build: {context: ., dockerfile: Containerfile, target: vlm}
x-paddle-image: &paddle-image
  image: localhost/document-ocr-paddle:0.1.0
  build: {context: ., dockerfile: Containerfile, target: paddle}
x-kdl-image: &kdl-image
  image: localhost/document-ocr-kdl:0.1.0
  build: {context: ., dockerfile: Containerfile, target: kdl}

x-jina-image: &jina-image
  image: localhost/document-ocr-jina:0.1.0
  build: {context: ., dockerfile: Containerfile, target: jina}
x-falcon-image: &falcon-image
  image: localhost/document-ocr-falcon:0.1.0
  build: {context: ., dockerfile: Containerfile, target: falcon}
x-nemotron-image: &nemotron-image
  image: localhost/document-ocr-nemotron:0.1.0
  build: {context: ., dockerfile: Containerfile, target: nemotron}

x-environment: &environment
  OCR_DATA_DIR: /data
  OCR_MODELS_DIR: /models
  OCR_CPU_THREADS: ${OCR_CPU_THREADS:-4}
  OCR_DPI: ${OCR_DPI:-250}
  OCR_RETRY_DPI: ${OCR_RETRY_DPI:-350}
  OCR_VLM_DPI: ${OCR_VLM_DPI:-150}
  OCR_REVIEW_THRESHOLD: ${OCR_REVIEW_THRESHOLD:-0.75}
  OCR_LAYOUT_THRESHOLD: ${OCR_LAYOUT_THRESHOLD:-0.5}
  OCR_MAX_UPLOAD_MB: ${OCR_MAX_UPLOAD_MB:-64}
  OCR_MAX_PAGES: ${OCR_MAX_PAGES:-300}
  OCR_MAX_PAGE_PIXELS: ${OCR_MAX_PAGE_PIXELS:-30000000}
  OCR_ENABLED_BACKENDS: ${OCR_ENABLED_BACKENDS:-paddle,dots_mocr,glm_ocr,chandra,lighton,kdl,lighton_small,jina,surya,falcon,nemotron}
  OCR_DOTS_QUANTIZATION: ${OCR_DOTS_QUANTIZATION:-Q5_K_M}
  OCR_DOTS_CONTEXT: ${OCR_DOTS_CONTEXT:-32768}
  OCR_GLM_CONTEXT: ${OCR_GLM_CONTEXT:-16384}
  OCR_GLM_TASK: ${OCR_GLM_TASK:-text}
  OCR_VLM_CONTEXT: ${OCR_VLM_CONTEXT:-16384}
  OCR_VLM_MAX_PIXELS: ${OCR_VLM_MAX_PIXELS:-1500000}
  OCR_DOTS_MAX_PIXELS: ${OCR_DOTS_MAX_PIXELS:-1000000}
  OCR_VLM_MAX_TOKENS: ${OCR_VLM_MAX_TOKENS:-8192}
  OCR_KV_CACHE_TYPE: ${OCR_KV_CACHE_TYPE:-q8_0}
  OCR_VLM_TIMEOUT_SECONDS: ${OCR_VLM_TIMEOUT_SECONDS:-3600}
  OCR_VLM_STARTUP_SECONDS: ${OCR_VLM_STARTUP_SECONDS:-300}


x-model-preparation: &model-preparation
  <<: *api-image
  command: ["ocr-service", "prepare-models"]
  volumes: ["models:/models"]
  restart: "no"

x-worker: &worker
  command: ["ocr-service", "worker"]
  volumes: ["data:/data", "models:/models:ro"]
  network_mode: none
  init: true
  shm_size: "512mb"
  stop_grace_period: 120s
  restart: unless-stopped

services:
  api:
    <<: *api-image
    command: ["ocr-service", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment: *environment
    ports: ["127.0.0.1:${OCR_PORT:-8000}:8000"]
    volumes: ["data:/data"]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  models-paddle:
    <<: *model-preparation
    profiles: [paddle]
    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: paddle
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  paddle:
    <<: [*worker, *paddle-image]
    profiles: [paddle]
    environment:
      <<: *environment
      OCR_WORKER_BACKEND: paddle
    depends_on:
      models-paddle:
        condition: service_completed_successfully

  models-dots-mocr:
    <<: *model-preparation
    profiles: [dots_mocr]
    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: dots_mocr
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  dots-mocr:
    <<: [*worker, *vlm-image]
    profiles: [dots_mocr]
    environment:
      <<: *environment
      OCR_WORKER_BACKEND: dots_mocr
    depends_on:
      models-dots-mocr:
        condition: service_completed_successfully

  models-glm-ocr:
    <<: *model-preparation
    profiles: [glm_ocr]
    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: glm_ocr
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  glm-ocr:
    <<: [*worker, *vlm-image]
    profiles: [glm_ocr]
    environment:
      <<: *environment
      OCR_WORKER_BACKEND: glm_ocr
    depends_on:
      models-glm-ocr:
        condition: service_completed_successfully

  models-chandra:
    <<: *model-preparation
    profiles: [chandra]
    environment:
      <<: *environment
      OCR_ENABLED_BACKENDS: chandra
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-true}

  chandra:
    <<: [*worker, *vlm-image]
    profiles: [chandra]
    environment:
      <<: *environment
      OCR_WORKER_BACKEND: chandra
    depends_on:
