# Each service lists its own image, runtime settings and environment.
name: document-ocr
services:

  api:
    image: localhost/document-ocr-api:0.1.0
    build:
      context: .
      dockerfile: Containerfile
      target: api
    command: [ocr-service, api, --host, 0.0.0.0, --port, '8000']
    environment:
      OCR_DATA_DIR: /data
      OCR_MODELS_DIR: /models
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-auto}
      OCR_CPU_RESERVE_CORES: ${OCR_CPU_RESERVE_CORES:-1}
      OCR_CPU_NICE: ${OCR_CPU_NICE:-10}
      OCR_LIGHTON_SMALL_QUANTIZATION: ${OCR_LIGHTON_SMALL_QUANTIZATION:-Q4_K_M}
      OCR_LIGHTON_SMALL_TASK: ${OCR_LIGHTON_SMALL_TASK:-transcription}
      OCR_LIGHTON_SMALL_THREADS: ${OCR_LIGHTON_SMALL_THREADS:-auto}
      OCR_LIGHTON_SMALL_PIN_THREADS: ${OCR_LIGHTON_SMALL_PIN_THREADS:-true}
      OCR_DPI: ${OCR_DPI:-250}
      OCR_RETRY_DPI: ${OCR_RETRY_DPI:-350}
      OCR_VLM_DPI: ${OCR_VLM_DPI:-150}
      OCR_REVIEW_THRESHOLD: ${OCR_REVIEW_THRESHOLD:-0.75}
      OCR_LAYOUT_THRESHOLD: ${OCR_LAYOUT_THRESHOLD:-0.5}
      OCR_MAX_UPLOAD_MB: ${OCR_MAX_UPLOAD_MB:-64}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-300}
      OCR_MAX_PAGE_PIXELS: ${OCR_MAX_PAGE_PIXELS:-30000000}
      OCR_ENABLED_BACKENDS: ${OCR_ENABLED_BACKENDS:-paddle,dots_mocr,glm_ocr,lighton_small}
      OCR_DOTS_QUANTIZATION: ${OCR_DOTS_QUANTIZATION:-Q5_K_M}
      OCR_DOTS_CONTEXT: ${OCR_DOTS_CONTEXT:-32768}
      OCR_GLM_CONTEXT: ${OCR_GLM_CONTEXT:-16384}
      OCR_GLM_TASK: ${OCR_GLM_TASK:-text}
      OCR_VLM_CONTEXT: ${OCR_VLM_CONTEXT:-16384}
      OCR_VLM_MAX_PIXELS: ${OCR_VLM_MAX_PIXELS:-2500000}
      OCR_DOTS_MAX_PIXELS: ${OCR_DOTS_MAX_PIXELS:-2500000}
      OCR_VLM_MAX_TOKENS: ${OCR_VLM_MAX_TOKENS:-8192}
      OCR_KV_CACHE_TYPE: ${OCR_KV_CACHE_TYPE:-q8_0}
      OCR_VLM_TIMEOUT_SECONDS: ${OCR_VLM_TIMEOUT_SECONDS:-3600}
      OCR_VLM_STARTUP_SECONDS: ${OCR_VLM_STARTUP_SECONDS:-300}
    ports: ['127.0.0.1:${OCR_PORT:-8000}:8000']
    volumes: ['data:/data']
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 3

  paddle:
    image: localhost/document-ocr-paddle:0.1.0
    build:
      context: .
      dockerfile: Containerfile
      target: paddle
    command: [ocr-service, worker]
    volumes: ['data:/data', '${OCR_MODELS_DIR:-./models}:/models:ro,z']
    network_mode: none
    init: true
    shm_size: 512mb
    stop_grace_period: 120s
    restart: unless-stopped
    profiles: [paddle]
    environment:
      OCR_DATA_DIR: /data
      OCR_MODELS_DIR: /models
      OCR_ENABLED_BACKENDS: paddle
      OCR_WORKER_BACKEND: paddle
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-auto}
      OCR_CPU_RESERVE_CORES: ${OCR_CPU_RESERVE_CORES:-1}
      OCR_CPU_NICE: ${OCR_CPU_NICE:-10}
      OCR_DPI: ${OCR_DPI:-250}
      OCR_RETRY_DPI: ${OCR_RETRY_DPI:-350}
      OCR_REVIEW_THRESHOLD: ${OCR_REVIEW_THRESHOLD:-0.75}
      OCR_LAYOUT_THRESHOLD: ${OCR_LAYOUT_THRESHOLD:-0.5}
      OCR_MAX_PAGE_PIXELS: ${OCR_MAX_PAGE_PIXELS:-30000000}

  dots-mocr:
    image: localhost/document-ocr-vlm:0.1.0
    build:
      context: .
      dockerfile: Containerfile
      target: vlm
    command: [ocr-service, worker]
    volumes: ['data:/data', '${OCR_MODELS_DIR:-./models}:/models:ro,z']
    network_mode: none
    init: true
    shm_size: 512mb
    stop_grace_period: 120s
    restart: unless-stopped
    profiles: [dots_mocr]
    environment:
      OCR_DATA_DIR: /data
      OCR_MODELS_DIR: /models
      OCR_ENABLED_BACKENDS: dots_mocr
      OCR_WORKER_BACKEND: dots_mocr
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-auto}
      OCR_CPU_RESERVE_CORES: ${OCR_CPU_RESERVE_CORES:-1}
      OCR_CPU_NICE: ${OCR_CPU_NICE:-10}
      OCR_VLM_DPI: ${OCR_VLM_DPI:-150}
      OCR_MAX_PAGE_PIXELS: ${OCR_MAX_PAGE_PIXELS:-30000000}
      OCR_VLM_MAX_PIXELS: ${OCR_VLM_MAX_PIXELS:-2500000}
      OCR_VLM_MAX_TOKENS: ${OCR_VLM_MAX_TOKENS:-8192}
      OCR_VLM_TIMEOUT_SECONDS: ${OCR_VLM_TIMEOUT_SECONDS:-3600}
      OCR_VLM_STARTUP_SECONDS: ${OCR_VLM_STARTUP_SECONDS:-300}
      OCR_KV_CACHE_TYPE: ${OCR_KV_CACHE_TYPE:-q8_0}
      OCR_DOTS_QUANTIZATION: ${OCR_DOTS_QUANTIZATION:-Q5_K_M}
      OCR_DOTS_CONTEXT: ${OCR_DOTS_CONTEXT:-32768}
      OCR_DOTS_MAX_PIXELS: ${OCR_DOTS_MAX_PIXELS:-2500000}

  glm-ocr:
    image: localhost/document-ocr-vlm:0.1.0
    build:
      context: .
      dockerfile: Containerfile
      target: vlm
    command: [ocr-service, worker]
    volumes: ['data:/data', '${OCR_MODELS_DIR:-./models}:/models:ro,z']
    network_mode: none
    init: true
    shm_size: 512mb
    stop_grace_period: 120s
    restart: unless-stopped
    profiles: [glm_ocr]
    environment:
      OCR_DATA_DIR: /data
      OCR_MODELS_DIR: /models
      OCR_ENABLED_BACKENDS: glm_ocr
      OCR_WORKER_BACKEND: glm_ocr
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-auto}
      OCR_CPU_RESERVE_CORES: ${OCR_CPU_RESERVE_CORES:-1}
      OCR_CPU_NICE: ${OCR_CPU_NICE:-10}
      OCR_VLM_DPI: ${OCR_VLM_DPI:-150}
      OCR_MAX_PAGE_PIXELS: ${OCR_MAX_PAGE_PIXELS:-30000000}
      OCR_VLM_MAX_PIXELS: ${OCR_VLM_MAX_PIXELS:-2500000}
      OCR_VLM_MAX_TOKENS: ${OCR_VLM_MAX_TOKENS:-8192}
      OCR_VLM_TIMEOUT_SECONDS: ${OCR_VLM_TIMEOUT_SECONDS:-3600}
      OCR_VLM_STARTUP_SECONDS: ${OCR_VLM_STARTUP_SECONDS:-300}
      OCR_KV_CACHE_TYPE: ${OCR_KV_CACHE_TYPE:-q8_0}
      OCR_GLM_CONTEXT: ${OCR_GLM_CONTEXT:-16384}
      OCR_GLM_TASK: ${OCR_GLM_TASK:-text}

  lighton-small:
    image: localhost/document-ocr-vlm:0.1.0
    build:
      context: .
      dockerfile: Containerfile
      target: vlm
    command: [ocr-service, worker]
    volumes: ['data:/data', '${OCR_MODELS_DIR:-./models}:/models:ro,z']
    network_mode: none
    init: true
    shm_size: 512mb
    stop_grace_period: 120s
    restart: unless-stopped
    profiles: [lighton_small]
    environment:
      OCR_DATA_DIR: /data
      OCR_MODELS_DIR: /models
      OCR_ENABLED_BACKENDS: lighton_small
      OCR_WORKER_BACKEND: lighton_small
      OCR_CPU_RESERVE_CORES: ${OCR_CPU_RESERVE_CORES:-1}
      OCR_CPU_NICE: ${OCR_CPU_NICE:-10}
      OCR_VLM_DPI: ${OCR_VLM_DPI:-150}
      OCR_MAX_PAGE_PIXELS: ${OCR_MAX_PAGE_PIXELS:-30000000}
      OCR_VLM_MAX_PIXELS: ${OCR_VLM_MAX_PIXELS:-2500000}
      OCR_VLM_MAX_TOKENS: ${OCR_VLM_MAX_TOKENS:-8192}
      OCR_VLM_TIMEOUT_SECONDS: ${OCR_VLM_TIMEOUT_SECONDS:-3600}
      OCR_VLM_STARTUP_SECONDS: ${OCR_VLM_STARTUP_SECONDS:-300}
      OCR_KV_CACHE_TYPE: ${OCR_KV_CACHE_TYPE:-q8_0}
      OCR_VLM_CONTEXT: ${OCR_VLM_CONTEXT:-16384}
      OCR_LIGHTON_SMALL_QUANTIZATION: ${OCR_LIGHTON_SMALL_QUANTIZATION:-Q4_K_M}
      OCR_LIGHTON_SMALL_TASK: ${OCR_LIGHTON_SMALL_TASK:-transcription}
      OCR_LIGHTON_SMALL_THREADS: ${OCR_LIGHTON_SMALL_THREADS:-auto}
      OCR_LIGHTON_SMALL_PIN_THREADS: ${OCR_LIGHTON_SMALL_PIN_THREADS:-true}

volumes:
  data: null
