[project]
name = "document-ocr-service"
version = "0.1.0"
description = "Offline Russian/English PDF OCR service for CPU"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "pymupdf==1.26.6",
  "lxml>=5.3,<7",
  "pyyaml>=6,<7",
  "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
ocr = [
  "paddleocr==3.3.2",
  "paddlex[ocr]==3.3.13",
  "paddlepaddle==3.2.2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx==0.28.1", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[project.scripts]
ocr-service = "ocr_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: real Paddle inference; requires prepared models and the ocr extra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
