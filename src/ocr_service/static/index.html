<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF OCR</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Документы · русский / английский</p><h1>Распознавание PDF</h1></div>
      <span id="worker-state" class="badge">Проверка сервиса…</span>
    </header>
    <section class="card">
      <form id="upload-form">
        <label for="pdf">Выберите PDF с текстом и таблицами</label>
        <div class="upload-row"><input id="pdf" name="file" type="file" accept="application/pdf,.pdf" required>
          <button id="upload-button" type="submit">Распознать</button></div>
        <p id="limits" class="muted">Обработка выполняется на CPU. Можно закрыть страницу и вернуться позже.</p>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <p id="worker-error" class="error" hidden></p>
    </section>
    <section id="job" class="card" hidden>
      <div class="section-heading"><h2 id="filename"></h2><span id="job-state" class="badge"></span></div>
      <progress id="progress" max="1" value="0" aria-label="Прогресс распознавания"></progress>
      <p id="progress-text" class="muted" aria-live="polite"></p>
      <div id="downloads" class="downloads" hidden>
        <a data-format="json">Скачать JSON</a><a data-format="markdown">Скачать Markdown</a><a data-format="html">Скачать HTML</a>
      </div>
      <div id="pages"></div>
    </section>
    <section class="card">
      <div class="section-heading"><h2>Последние документы</h2><button id="refresh" class="secondary">Обновить</button></div>
      <ul id="history"><li class="muted">Загрузка…</li></ul>
    </section>
    <footer><a href="/docs">Документация API</a><span>Результаты сохраняются на сервере</span></footer>
  </main>
</body>
</html>
