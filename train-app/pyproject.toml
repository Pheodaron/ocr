[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-training-workbench"
version = "0.1.0"
description = "Локальная подготовка данных и дообучение LightOnOCR"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<3", "alembic>=1.15,<2", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pymupdf>=1.25,<2", "pillow>=11,<13", "lxml>=5.3,<7",
  "rapidfuzz>=3.12,<4", "apted>=1.0.3,<2", "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.8,<3", "torchvision>=0.23,<1", "transformers>=5.3,<6",
  "peft>=0.18,<1", "accelerate>=1.10,<2", "safetensors>=0.5,<1",
  "huggingface-hub>=1,<2", "numpy>=2,<3", "sentencepiece>=0.2,<1",
  "protobuf>=5,<8", "gguf>=0.17,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/train_app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
